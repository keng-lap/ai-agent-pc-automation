name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        working-directory: src/backend
        run: python -m pip install -e ".[dev]"
      - name: Run backend tests
        working-directory: src/backend
        env:
          APP_ENV: test
          BACKEND_HOST: 127.0.0.1
          BACKEND_PORT: "8000"
          FRONTEND_PORT: "4200"
          LOCAL_AGENT_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: python -m pytest ../../tests/backend
      - name: Run AI reviewer unit tests
        working-directory: src/backend
        run: python -m unittest discover -s ../../tests/automation -v
      - name: Run Ruff
        working-directory: src/backend
        run: |
          ruff check --fix agent_backend ../../tests/backend
          git diff -- agent_backend/windows_secret_storage.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Run frontend unit tests
        working-directory: src/frontend
        run: npm test -- --watch=false
      - name: Install Playwright Chromium
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E tests (desktop and mobile viewports)
        working-directory: src/frontend
        env:
          CI: true
          LOCAL_AGENT_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: npm run test:e2e
      - name: Build frontend
        working-directory: src/frontend
        run: npm run build
