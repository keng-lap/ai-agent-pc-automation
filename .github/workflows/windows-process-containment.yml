name: Windows Process Containment

on:
  pull_request:
    paths:
      - "src/backend/agent_backend/authenticator.py"
      - "src/backend/agent_backend/auth_api.py"
      - "src/backend/agent_backend/windows_secret_storage.py"
      - "tests/backend/test_authenticator.py"
      - "tests/backend/test_auth_api.py"
      - "tests/backend/test_windows_secret_storage.py"
      - "src/backend/agent_backend/process_containment.py"
      - "src/backend/agent_backend/job_lifecycle.py"
      - "src/backend/agent_backend/platform_storage.py"
      - "src/backend/agent_backend/job_store.py"
      - "src/backend/agent_backend/jobs_api.py"
      - "src/backend/agent_backend/approval_reservation_store.py"
      - "src/backend/agent_backend/software_approval_api.py"
      - "src/backend/agent_backend/software_install_worker.py"
      - "src/backend/agent_backend/software_install_api.py"
      - "src/backend/agent_backend/software_install_plans.py"
      - "src/backend/agent_backend/plan_api.py"
      - "src/backend/agent_backend/main.py"
      - "tests/backend/test_software_approval_api.py"
      - "tests/backend/test_software_install_api.py"
      - "tests/backend/test_software_evidence.py"
      - "tests/backend/test_software_install_worker.py"
      - "tests/backend/test_plan_api.py"
      - "src/backend/agent_backend/winget_execution.py"
      - "tests/backend/test_job_lifecycle.py"
      - "tests/backend/test_platform_storage.py"
      - "tests/backend/test_job_store.py"
      - "tests/backend/test_jobs_api.py"
      - "tests/backend/test_approval_reservation_store.py"
      - "tests/backend/test_approval_reservation_worker_queue.py"
      - "tests/backend/test_winget_execution.py"
      - "tests/backend/test_process_containment.py"
      - "scripts/acceptance/P6-609-B2/**"
      - "scripts/acceptance/P6-609-C/**"
      - "src/backend/pyproject.toml"
      - ".github/workflows/windows-process-containment.yml"
  push:
    branches:
      - main
    paths:
      - "src/backend/agent_backend/authenticator.py"
      - "src/backend/agent_backend/auth_api.py"
      - "tests/backend/test_auth_api.py"
      - "src/backend/agent_backend/windows_secret_storage.py"
      - "tests/backend/test_authenticator.py"
      - "tests/backend/test_windows_secret_storage.py"
      - "src/backend/agent_backend/process_containment.py"
      - "src/backend/agent_backend/job_lifecycle.py"
      - "src/backend/agent_backend/platform_storage.py"
      - "src/backend/agent_backend/job_store.py"
      - "src/backend/agent_backend/jobs_api.py"
      - "tests/backend/test_job_lifecycle.py"
      - "tests/backend/test_platform_storage.py"
      - "tests/backend/test_job_store.py"
      - "tests/backend/test_jobs_api.py"
      - "tests/backend/test_process_containment.py"
      - "scripts/acceptance/P6-609-B2/**"
      - "src/backend/pyproject.toml"
      - ".github/workflows/windows-process-containment.yml"

permissions:
  contents: read

jobs:
  windows-process-containment:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install -e "src/backend[dev]"
      - name: Run backend Ruff checks
        run: python -m ruff check src/backend/agent_backend tests/backend
      - name: Test Windows authenticator storage and DPAPI
        run: python -m pytest tests/backend/test_authenticator.py tests/backend/test_auth_api.py tests/backend/test_windows_secret_storage.py -q
      - name: Validate B2 Windows acceptance scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem 'scripts/acceptance/P6-609-B2' -Filter '*.ps1' | Sort-Object FullName
          if (-not $files) { throw 'No B2 PowerShell acceptance scripts were found.' }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
            }
          }
          $cFiles = Get-ChildItem 'scripts/acceptance/P6-609-C' -Filter '*.ps1' | Sort-Object FullName
          foreach ($file in $cFiles) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
            }
          }
          python -m ruff check scripts/acceptance/P6-609-B2/windows_b2_mutex_probe.py
          if ($LASTEXITCODE -ne 0) { throw "Ruff failed with exit code $LASTEXITCODE." }
          python scripts/acceptance/P6-609-B2/windows_b2_mutex_probe.py --help
          if ($LASTEXITCODE -ne 0) { throw "Mutex probe CLI smoke test failed with exit code $LASTEXITCODE." }
          python -m py_compile scripts/acceptance/P6-609-B2/windows_b2_mutex_probe.py
          if ($LASTEXITCODE -ne 0) { throw "Python compilation failed with exit code $LASTEXITCODE." }
      - name: Test job lifecycle, Windows storage gate, and containment API
        run: python -m pytest tests/backend/test_job_lifecycle.py tests/backend/test_process_containment.py tests/backend/test_platform_storage.py tests/backend/test_job_store.py tests/backend/test_jobs_api.py tests/backend/test_approval_reservation_store.py tests/backend/test_approval_reservation_worker_queue.py tests/backend/test_winget_execution.py tests/backend/test_software_approval_api.py tests/backend/test_software_install_api.py tests/backend/test_software_evidence.py tests/backend/test_software_install_worker.py tests/backend/test_plan_api.py -q
