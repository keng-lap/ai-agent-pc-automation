name: Windows Process Containment

on:
  pull_request:
    paths:
      - "src/backend/agent_backend/process_containment.py"
      - "src/backend/agent_backend/job_lifecycle.py"
      - "tests/backend/test_job_lifecycle.py"
      - "src/backend/pyproject.toml"
      - ".github/workflows/windows-process-containment.yml"
  push:
    branches:
      - main
    paths:
      - "src/backend/agent_backend/process_containment.py"
      - "src/backend/agent_backend/job_lifecycle.py"
      - "tests/backend/test_job_lifecycle.py"
      - "src/backend/pyproject.toml"
      - ".github/workflows/windows-process-containment.yml"

permissions:
  contents: read

jobs:
  windows-process-containment:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install -e "src/backend[dev]"
      - name: Diagnose Ruff import formatting
        run: |
          ruff check --select I --fix tests/backend/test_job_lifecycle.py
          git diff -- tests/backend/test_job_lifecycle.py
      - name: Test job lifecycle and Windows containment API
        run: python -m pytest tests/backend/test_job_lifecycle.py -q
