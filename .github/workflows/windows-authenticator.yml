name: Windows Authenticator DPAPI

on:
  pull_request:
    paths:
      - "src/backend/agent_backend/authenticator.py"
      - "src/backend/agent_backend/auth_api.py"
      - "src/backend/agent_backend/plan_api.py"
      - "src/backend/agent_backend/software_approval_api.py"
      - "src/backend/agent_backend/step_up.py"
      - "src/backend/agent_backend/totp.py"
      - "src/backend/agent_backend/windows_secret_storage.py"
      - "tests/backend/test_authenticator.py"
      - "tests/backend/test_auth_api.py"
      - "tests/backend/test_plan_api.py"
      - "tests/backend/test_software_approval_api.py"
      - "tests/backend/test_step_up.py"
      - "tests/backend/test_totp.py"
      - "tests/backend/test_windows_secret_storage.py"
      - "src/backend/agent_backend/software_catalog.py"
      - "tests/backend/test_software_catalog_windows.py"
      - "src/backend/pyproject.toml"
      - "scripts/P516-01-setup-google-oauth.ps1"
      - ".github/workflows/windows-authenticator.yml"
  push:
    branches:
      - main
    paths:
      - "src/backend/agent_backend/authenticator.py"
      - "src/backend/agent_backend/auth_api.py"
      - "src/backend/agent_backend/plan_api.py"
      - "src/backend/agent_backend/software_approval_api.py"
      - "src/backend/agent_backend/step_up.py"
      - "src/backend/agent_backend/totp.py"
      - "src/backend/agent_backend/windows_secret_storage.py"
      - "tests/backend/test_authenticator.py"
      - "tests/backend/test_auth_api.py"
      - "tests/backend/test_plan_api.py"
      - "tests/backend/test_software_approval_api.py"
      - "tests/backend/test_step_up.py"
      - "tests/backend/test_totp.py"
      - "tests/backend/test_windows_secret_storage.py"
      - "src/backend/pyproject.toml"
      - ".github/workflows/windows-authenticator.yml"

permissions:
  contents: read

jobs:
  windows-dpapi:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install -e "src/backend[dev]"
      - name: Parse Google OAuth PowerShell setup script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "scripts/P516-01-setup-google-oauth.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Test Windows DPAPI authenticator storage
        run: python -m pytest tests/backend/test_authenticator.py -q
      - name: Verify live Microsoft WinGet catalog signature and search
        run: python -m pytest tests/backend/test_software_catalog_windows.py -q
