name: Windows Packaged Backend

on:
  pull_request:
    paths:
      - "src/backend/**"
      - "scripts/build-backend-windows.ps1"
      - ".github/workflows/windows-packaged-backend.yml"
  push:
    branches:
      - main
    paths:
      - "src/backend/**"
      - "scripts/build-backend-windows.ps1"
      - ".github/workflows/windows-packaged-backend.yml"

permissions:
  contents: read

jobs:
  package-backend:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build protected-runtime candidate
        shell: pwsh
        run: ./scripts/build-backend-windows.ps1
      - name: Verify executable exists and is PE
        shell: pwsh
        run: |
          $exe = Get-Item dist/AgentBackend.exe
          if ($exe.Length -lt 1MB) { throw "Backend executable is unexpectedly small." }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Backend output is not a Windows PE executable." }
          Get-FileHash $exe.FullName -Algorithm SHA256
      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-backend-windows-unsigned
          path: dist/AgentBackend.exe
          if-no-files-found: error
          retention-days: 7
