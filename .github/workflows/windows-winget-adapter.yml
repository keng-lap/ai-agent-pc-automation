name: Windows WinGet Adapter

on:
  pull_request:
    paths:
      - "src/backend/agent_backend/winget_adapter.py"
      - "src/backend/agent_backend/software_approval.py"
      - "tests/backend/test_winget_adapter.py"
      - "src/backend/pyproject.toml"
      - ".github/workflows/windows-winget-adapter.yml"
  push:
    branches:
      - main
    paths:
      - "src/backend/agent_backend/winget_adapter.py"
      - "src/backend/agent_backend/software_approval.py"
      - "tests/backend/test_winget_adapter.py"
      - "src/backend/pyproject.toml"
      - ".github/workflows/windows-winget-adapter.yml"

permissions:
  contents: read

jobs:
  windows-winget-adapter:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install -e "src/backend[dev]"
      - name: Test exact-artifact WinGet adapter and Windows manifest locks
        run: python -m pytest tests/backend/test_winget_adapter.py -q
