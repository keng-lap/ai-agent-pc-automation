name: Windows Installer Helper Security Core

on:
  pull_request:
    paths:
      - "src/windows/InstallerHelper.Security/**"
      - ".github/workflows/windows-helper-security.yml"
  push:
    branches:
      - main
    paths:
      - "src/windows/InstallerHelper.Security/**"
      - ".github/workflows/windows-helper-security.yml"

permissions:
  contents: read

jobs:
  build-helper-security-core:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Windows security core
        run: dotnet build src/windows/InstallerHelper.Security/InstallerHelper.Security.csproj --configuration Release --no-restore
