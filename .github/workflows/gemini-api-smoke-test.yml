name: Gemini API Live Smoke Test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gemini-api-live-smoke
  cancel-in-progress: false
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Install Gemini SDK
        run: python -m pip install --disable-pip-version-check "google-genai>=1.0.0"
      - name: Call Gemini 3.8 Flash generateContent
        timeout-minutes: 2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gemini_api_smoke_test.py
